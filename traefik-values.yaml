deployment:
  kind: DaemonSet

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: true
    exposedPort: 80

  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: true
    exposedPort: 443

service:
  enabled: true
  type: ClusterIP

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

providers:
  kubernetesCRD:
    enabled: true

  kubernetesIngress:
    enabled: true

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik