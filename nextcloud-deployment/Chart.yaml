apiVersion: v2
name: cloud-storage-platform
description: >
  Production Helm chart for a self-hosted cloud storage platform:
  Nextcloud (drive/UI) backed by MariaDB (metadata), Redis (file locking/cache),
  and MinIO (S3-compatible primary object storage).
type: application
version: 1.0.0
appVersion: "29"
maintainers:
  - name: Pengseang
home: https://github.com/nextcloud/docker

dependencies:
  - name: mariadb
    version: "1.0.0"
    condition: mariadb.enabled
  - name: redis
    version: "1.0.0"
    condition: redis.enabled
  - name: minio
    version: "1.0.0"
    condition: minio.enabled
  - name: nextcloud
    version: "1.0.0"
    condition: nextcloud.enabled
