{{- if and .Values.traefik.enabled .Values.traefik.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "minio.fullname" . }}-console-tls
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ .Values.ingress.console.host | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: {{ .Values.traefik.tls.secretName | default "minio-console-tls" }}
{{- end }}
