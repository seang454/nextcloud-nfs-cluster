# Defaults for the nextcloud subchart.
# Optimized for:
# - Traefik CRDs (IngressRoute, Middlewares, TLSOption, TLSStore, ServersTransport)
# - NFS Storage Provisioner / PVC (nfs-pvc / nfs-client)

replicaCount: 1

image:
  repository: nextcloud
  tag: "29-fpm"
  pullPolicy: IfNotPresent

nginx:
  image:
    repository: nginx
    tag: "1.27-alpine"

admin:
  username: admin
  existingSecret: ""
  password: "CHANGE_ME_ADMIN"

database:
  name: nextcloud
  username: nextcloud
  existingSecret: ""

persistence:
  enabled: true
  existingClaim: ""   # Existing PVC name (e.g. nfs-pvc) or empty string to provision dynamically
  storageClass: "nfs-client"
  accessMode: ReadWriteMany
  size: 10Gi

objectStore:
  bucket: nextcloud-data
  port: 9000
  ssl: false
  region: us-east-1
  usePathStyle: true
  existingSecret: ""

resources:
  php:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  nginx:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

autoscaling:
  enabled: false

# Traefik Integration (IngressRoute, Middlewares, TLSOption, TLSStore, ServersTransport)
traefik:
  enabled: true

  ingressRoute:
    enabled: true
    entryPoints:
      - web
      - websecure
    servicePort: 80
    annotations: {}
    customMiddlewares: []

  tls:
    enabled: true
    secretName: nextcloud-tls

  tlsOption:
    enabled: true
    minVersion: "VersionTLS12"
    cipherSuites:
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      - TLS_AES_128_GCM_SHA256
      - TLS_AES_256_GCM_SHA384
      - TLS_CHACHA20_POLY1305_SHA256
    sniStrict: false

  tlsStore:
    enabled: true

  serversTransport:
    enabled: false
    name: "backend-internal-mtls"
    insecureSkipVerify: true

  middlewares:
    rateLimit:
      enabled: true
      average: 100
      burst: 50

    forwardAuth:
      enabled: false   # Disabled: oidc_login handles SSO directly with Keycloak
      address: "http://keycloak-oauth2-oauth2-proxy.keycloak-oauth2.svc.k8scluster:4180"
      trustForwardHeader: true
      authResponseHeaders:
        - "X-Auth-User"
        - "X-Auth-Email"
        - "Authorization"
      excludeSyncPaths: true

    headers:
      enabled: true
      stsSeconds: 31536000

    redirectRegex:
      enabled: true

    buffering:
      enabled: true
      maxRequestBodyBytes: 10737418240  # 10GB upload limit
      memRequestBodyBytes: 20971520    # 20MB in-memory buffer

    compress:
      enabled: true

    ipAllowList:
      enabled: false   # Set true to restrict access by IP
      sourceRange:
        - "35.201.128.109/32"

# OpenID Connect (Keycloak SSO) Integration
oidc:
  enabled: true
  providerUrl: "https://keycloak.seang.shop/realms/enterprise-realm"
  clientId: "oauth2-proxy"
  clientSecret: "Secret-Keycloak-OAuth2Proxy-2026-ChangeMe"
  autoRedirect: true
  endSessionRedirect: true
  buttonText: "Log in with Keycloak"
  disableRegistration: false
  redirFallback: true
  scope: "openid profile email"
  codeChallengeMethod: "S256"

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: true

serviceAccount:
  create: true
  name: ""

phpMemoryLimit: "1024M"
phpUploadLimit: "10G"