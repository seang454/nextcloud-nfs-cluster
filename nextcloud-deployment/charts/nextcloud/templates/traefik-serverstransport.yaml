{{- if and .Values.traefik.enabled .Values.traefik.serversTransport.enabled }}
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ .Values.traefik.serversTransport.name | default "backend-internal-mtls" }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  insecureSkipVerify: {{ .Values.traefik.serversTransport.insecureSkipVerify | default true }}
  {{- if .Values.traefik.serversTransport.rootCAsSecrets }}
  rootCAsSecrets:
    {{- toYaml .Values.traefik.serversTransport.rootCAsSecrets | nindent 4 }}
  {{- end }}
  {{- if .Values.traefik.serversTransport.certificates }}
  certificates:
    {{- toYaml .Values.traefik.serversTransport.certificates | nindent 4 }}
  {{- end }}
{{- end }}
