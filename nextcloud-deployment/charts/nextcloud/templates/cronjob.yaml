apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nextcloud.fullname" . }}-cron
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "nextcloud.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              # Preferred affinity for scheduling on same node if possible, though NFS RWX allows multi-node access
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: nextcloud
                        app.kubernetes.io/instance: {{ .Release.Name }}
                    topologyKey: kubernetes.io/hostname
          initContainers:
            - name: wait-for-install
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  echo "Waiting for Nextcloud to finish installing..."
                  # config.php is created EARLY by the entrypoint (before occ install runs),
                  # so we must check for 'installed' => true inside it, not just file existence.
                  until grep -q "'installed' => true" /var/www/html/config/config.php 2>/dev/null; do
                    echo "Not installed yet (config.php missing or installed=false), sleeping 5s..."
                    sleep 5
                  done
                  echo "Nextcloud is fully installed. Proceeding."
              volumeMounts:
                - name: nextcloud-config
                  mountPath: /var/www/html/config
                - name: nextcloud-custom-apps
                  mountPath: /var/www/html/custom_apps
                - name: nextcloud-data
                  mountPath: /var/www/html/data
          containers:
            - name: nextcloud-cron
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ ! -f /var/www/html/version.php ]; then
                    (cd /usr/src/nextcloud && tar --exclude='./config' --exclude='./custom_apps' --exclude='./data' -cf - .) | (cd /var/www/html && tar xf -)
                  fi
                  chown -R www-data:www-data /var/www/html 2>/dev/null || true
                  su -s /bin/sh www-data -c "php -f /var/www/html/cron.php"
              volumeMounts:
                - name: nextcloud-html
                  mountPath: /var/www/html
                - name: nextcloud-config
                  mountPath: /var/www/html/config
                - name: nextcloud-custom-apps
                  mountPath: /var/www/html/custom_apps
                - name: nextcloud-data
                  mountPath: /var/www/html/data
              env:
                - name: MYSQL_HOST
                  value: {{ include "nextcloud.mariadb.host" . }}
                - name: MYSQL_DATABASE
                  value: {{ .Values.database.name | quote }}
                - name: MYSQL_USER
                  value: {{ .Values.database.username | quote }}
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.existingSecret | default (printf "%s-mariadb-auth" .Release.Name) }}
                      key: mariadb-password
                - name: REDIS_HOST
                  value: {{ include "nextcloud.redis.host" . }}
                - name: REDIS_HOST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ printf "%s-redis-auth" .Release.Name }}
                      key: redis-password
          volumes:
            - name: nextcloud-html
              emptyDir: {}
            - name: nextcloud-config
              persistentVolumeClaim:
                claimName: {{ .Values.persistence.existingClaim | default (printf "%s-config" (include "nextcloud.fullname" .)) }}
            - name: nextcloud-custom-apps
              persistentVolumeClaim:
                claimName: {{ printf "%s-custom-apps" (include "nextcloud.fullname" .) }}
            - name: nextcloud-data
              persistentVolumeClaim:
                claimName: {{ printf "%s-data" (include "nextcloud.fullname" .) }}

