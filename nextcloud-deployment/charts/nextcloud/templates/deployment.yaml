apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nextcloud.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "nextcloud.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nextcloud.serviceAccountName" . }}
      securityContext:
        fsGroup: 33   # www-data
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Wait for MariaDB to accept TCP connections before starting the
        # Nextcloud entrypoint. Without this, the first-boot installer runs
        # while MariaDB is still initialising, silently fails, and leaves
        # Nextcloud in a broken "not installed" state (causing cron CrashLoopBackOff).
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MariaDB at {{ include "nextcloud.mariadb.host" . }}:3306..."
              until nc -z {{ include "nextcloud.mariadb.host" . }} 3306; do
                echo "MariaDB not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "MariaDB is accepting connections."
        # Wait for Redis as well — Nextcloud configures it during install.
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis at {{ include "nextcloud.redis.host" . }}:6379..."
              until nc -z {{ include "nextcloud.redis.host" . }} 6379; do
                echo "Redis not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "Redis is ready."
        {{- if .Values.bootstrap.enabled }}
        # Populate the shared Nextcloud code volume once before the app
        # containers start. This avoids multiple replicas racing inside the
        # official image entrypoint on a fresh RWX/NFS PVC.
        - name: nextcloud-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu

              target=/var/www/html
              source=/usr/src/nextcloud
              lock="${target}/.nextcloud-bootstrap.lock"
              timeout={{ .Values.bootstrap.lockTimeoutSeconds | int }}
              interval={{ .Values.bootstrap.waitIntervalSeconds | int }}
              elapsed=0

              if [ -f "${target}/version.php" ]; then
                echo "Nextcloud code already exists on the shared volume."
                exit 0
              fi

              while ! mkdir "${lock}" 2>/dev/null; do
                if [ -f "${target}/version.php" ]; then
                  echo "Nextcloud code became available while waiting."
                  exit 0
                fi

                if [ "${elapsed}" -ge "${timeout}" ]; then
                  echo "Timed out waiting for ${lock}; remove it only after confirming no bootstrap pod is still copying." >&2
                  exit 1
                fi

                echo "Another pod is bootstrapping Nextcloud files; waiting ${interval}s..."
                sleep "${interval}"
                elapsed=$((elapsed + interval))
              done

              cleanup() {
                rmdir "${lock}" 2>/dev/null || true
              }
              trap cleanup EXIT INT TERM

              if [ -f "${target}/version.php" ]; then
                echo "Nextcloud code already exists after acquiring lock."
                exit 0
              fi

              echo "Copying Nextcloud application files to the shared volume..."
              find "${target}" -mindepth 1 -maxdepth 1 \
                ! -name ".nextcloud-bootstrap.lock" \
                ! -name "config" \
                ! -name "custom_apps" \
                ! -name "data" \
                -exec rm -rf {} +

              installed=false
              if grep -q "'installed' => true" "${target}/config/config.php" 2>/dev/null || grep -q "'dbname'" "${target}/config/config.php" 2>/dev/null; then
                installed=true
              fi

              if [ "${installed}" = true ]; then
                (cd "${source}" && tar --exclude='./config' --exclude='./custom_apps' --exclude='./data' -cf - .) | (cd "${target}" && tar xf -)
              else
                (cd "${source}" && tar --exclude='./config' --exclude='./custom_apps' --exclude='./data' --exclude='./version.php' -cf - .) | (cd "${target}" && tar xf -)
              fi

              chown -R www-data:www-data "${target}" 2>/dev/null || true
              chmod -R u+rwX,g+rwX "${target}/apps" "${target}/data" "${target}/custom_apps" 2>/dev/null || true
              chmod 0777 "${target}/config"
              if [ -f "${target}/config/config.php" ] && [ ! -s "${target}/config/config.php" ]; then
                rm -f "${target}/config/config.php"
              fi
              if [ ! -f "${target}/config/config.php" ]; then
                su -s /bin/sh www-data -c "touch ${target}/config/config.php"
              fi
              chown www-data:www-data "${target}/config/config.php" 2>/dev/null || true
              chmod 0666 "${target}/config/config.php"
              # Always create .ocdata — required by occ even during first install.
              su -s /bin/sh www-data -c "touch ${target}/data/.ocdata"
              # On fresh installs, create the CAN_INSTALL sentinel so the
              # Nextcloud web-based or entrypoint installer is allowed to run.
              if [ "${installed}" != true ]; then
                su -s /bin/sh www-data -c "touch ${target}/config/CAN_INSTALL"
              fi
              echo "Nextcloud code bootstrap complete."
          volumeMounts:
            - name: nextcloud-html
              mountPath: /var/www/html
            - name: nextcloud-config
              mountPath: /var/www/html/config
            - name: nextcloud-custom-apps
              mountPath: /var/www/html/custom_apps
            - name: nextcloud-data
              mountPath: /var/www/html/data
        {{- end }}
      containers:
        # --- PHP-FPM: runs the actual Nextcloud application code ---

        - name: php-fpm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              if [ -f /var/www/html/config/config.php ]; then
                php -r 'include("/var/www/html/config/config.php"); if (isset($CONFIG["dbname"]) && !isset($CONFIG["installed"])) { $CONFIG["installed"] = true; file_put_contents("/var/www/html/config/config.php", "<?php\n\$CONFIG = " . var_export($CONFIG, true) . ";\n"); }' 2>/dev/null || true
              fi
              (
                i=0
                while [ "$i" -lt 600 ]; do
                  chmod 0777 /var/www/html/config 2>/dev/null || true
                  if [ -f /var/www/html/config/config.php ]; then
                    chown www-data:www-data /var/www/html/config/config.php 2>/dev/null || true
                    chmod 0666 /var/www/html/config/config.php 2>/dev/null || true
                  fi
                  i=$((i + 1))
                  sleep 0.2
                done
              ) &
              exec /entrypoint.sh php-fpm
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    (
                      occ() {
                        su -s /bin/sh www-data -c "php /var/www/html/occ $*"
                      }
                      until occ status --output=json 2>/dev/null | grep -q '"installed":true'; do
                        sleep 5
                      done
                      if [ ! -f /var/www/html/custom_apps/oidc_login/appinfo/info.xml ]; then
                        echo "Installing oidc_login app files..."
                        occ app:disable oidc_login >/dev/null 2>&1 || true
                        occ app:remove oidc_login >/dev/null 2>&1 || true
                        occ app:install oidc_login
                      elif ! occ app:list 2>/dev/null | sed -n '/Enabled:/,/Disabled:/p' | grep -q "oidc_login:"; then
                        echo "Enabling oidc_login..."
                        occ app:enable oidc_login
                      fi
                    ) >/tmp/poststart.log 2>&1 &
          ports:
            - name: fpm
              containerPort: 9000
          env:
            - name: MYSQL_HOST
              value: {{ include "nextcloud.mariadb.host" . }}
            - name: MYSQL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-mariadb-auth" .Release.Name) }}
                  key: mariadb-password
            - name: REDIS_HOST
              value: {{ include "nextcloud.redis.host" . }}
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-redis-auth" .Release.Name }}
                  key: redis-password
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | default (printf "%s-admin" (include "nextcloud.fullname" .)) }}
                  key: username
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | default (printf "%s-admin" (include "nextcloud.fullname" .)) }}
                  key: password
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              # Space-separated list: public domain + internal service name + localhost
              value: "{{ .Values.global.domain }} {{ include "nextcloud.fullname" . }} localhost"
            - name: OBJECTSTORE_S3_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            - name: OBJECTSTORE_S3_HOST
              value: {{ include "nextcloud.minio.host" . }}
            - name: OBJECTSTORE_S3_PORT
              value: {{ .Values.objectStore.port | quote }}
            - name: OBJECTSTORE_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.existingSecret | default (printf "%s-minio-auth" .Release.Name) }}
                  key: root-user
            - name: OBJECTSTORE_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.existingSecret | default (printf "%s-minio-auth" .Release.Name) }}
                  key: root-password
            - name: OBJECTSTORE_S3_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: OBJECTSTORE_S3_SSL
              value: {{ .Values.objectStore.ssl | quote }}
            - name: OBJECTSTORE_S3_USEPATH_STYLE
              value: {{ .Values.objectStore.usePathStyle | quote }}
            - name: OBJECTSTORE_S3_AUTOCREATE
              value: "false"   # bucket is created by the minio-create-bucket Job
            - name: PHP_MEMORY_LIMIT
              value: {{ .Values.phpMemoryLimit | quote }}
            - name: PHP_UPLOAD_LIMIT
              value: {{ .Values.phpUploadLimit | quote }}
          volumeMounts:
            - name: nextcloud-html
              mountPath: /var/www/html
            - name: nextcloud-config
              mountPath: /var/www/html/config
            - name: nextcloud-custom-apps
              mountPath: /var/www/html/custom_apps
            - name: nextcloud-data
              mountPath: /var/www/html/data
            - name: php-fpm-conf
              mountPath: /usr/local/etc/php-fpm.d/zz-custom.conf
              subPath: zz-custom.conf
            - name: php-fpm-conf
              mountPath: /usr/local/etc/php/conf.d/zz-opcache.ini
              subPath: zz-opcache.ini
            {{- if .Values.oidc.enabled }}
            - name: oidc-conf
              mountPath: /var/www/html/config/oidc.config.php
              subPath: oidc.config.php
            {{- end }}
          resources:
            {{- toYaml .Values.resources.php | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "php-fpm-healthcheck || exit 0"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: fpm
            failureThreshold: 360   # 60 min — first-boot init (file copy + occ install) over WAN NFS can take time
            periodSeconds: 10

        # --- nginx: serves static assets + fronts php-fpm over FastCGI on localhost ---
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nextcloud-html
              mountPath: /var/www/html
              readOnly: true
            - name: nextcloud-config
              mountPath: /var/www/html/config
              readOnly: true
            - name: nextcloud-custom-apps
              mountPath: /var/www/html/custom_apps
              readOnly: true
            - name: nextcloud-data
              mountPath: /var/www/html/data
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- if .Values.oidc.enabled }}
            - name: oidc-conf
              mountPath: /var/www/html/config/oidc.config.php
              subPath: oidc.config.php
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                # Use localhost — probe runs inside the pod (not through ingress).
                # Using the public domain caused 400 Bad Request when trusted_domains
                # was not yet configured to include it.
                - name: Host
                  value: "localhost"
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: nextcloud-html
          emptyDir: {}
        - name: nextcloud-config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-config" (include "nextcloud.fullname" .)) }}
        - name: nextcloud-custom-apps
          persistentVolumeClaim:
            claimName: {{ printf "%s-custom-apps" (include "nextcloud.fullname" .) }}
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: {{ printf "%s-data" (include "nextcloud.fullname" .) }}
        - name: nginx-conf
          configMap:
            name: {{ include "nextcloud.fullname" . }}-nginx-conf
        - name: php-fpm-conf
          configMap:
            name: {{ include "nextcloud.fullname" . }}-php-fpm-conf
        {{- if .Values.oidc.enabled }}
        - name: oidc-conf
          configMap:
            name: {{ include "nextcloud.fullname" . }}-oidc-conf
        {{- end }}
