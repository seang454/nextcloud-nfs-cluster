# helm install csp . -f environments/production-values.yaml -n nextcloud-prod --create-namespace
#
# PRODUCTION PREREQUISITE: create the real Secrets referenced below *before*
# installing -- ideally via External Secrets Operator pulling from your Vault
# instance (the same pattern already used elsewhere on your platform), e.g.:
#
#   kind: ExternalSecret
#   metadata: { name: csp-mariadb-auth }
#   spec:
#     secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
#     target: { name: csp-mariadb-auth }
#     data:
#       - secretKey: mariadb-root-password
#         remoteRef: { key: secret/data/nextcloud/mariadb, property: root-password }
#       - secretKey: mariadb-password
#         remoteRef: { key: secret/data/nextcloud/mariadb, property: password }
#
# Repeat the pattern for csp-redis-auth, csp-minio-auth, and the nextcloud
# admin secret, then reference the resulting Secret names below via each
# `existingSecret` field so no plaintext credentials ever live in this file.

global:
  storageClass: "nfs-client"
  domain: "nextcloud.seang.shop"
  workerIp: "35.201.128.109"

mariadb:
  replicaCount: 1                 # single-primary MariaDB; consider Galera/Percona XtraDB
                                   # cluster or a managed cloud SQL service for true HA
  auth:
    existingSecret: "csp-mariadb-auth"
  persistence:
    storageClass: "nfs-client"
    size: 50Gi
  resources:
    requests: { cpu: 300m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }

redis:
  existingSecret: "csp-redis-auth"
  persistence:
    storageClass: "nfs-client"
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m,  memory: 256Mi }

minio:
  existingSecret: "csp-minio-auth"
  persistence:
    storageClass: "nfs-client"
    size: 500Gi
  resources:
    requests: { cpu: 300m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi }
  traefik:
    ingressRoute:
      enabled: false

nextcloud:
  replicaCount: 1
  bootstrap:
    enabled: true
    lockTimeoutSeconds: 3600
    waitIntervalSeconds: 5
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 65
  admin:
    existingSecret: "csp-nextcloud-admin"
  database:
    existingSecret: "csp-mariadb-auth"
  objectStore:
    existingSecret: "csp-minio-auth"
  persistence:
    existingClaim: ""
    storageClass: "nfs-client"
    accessMode: ReadWriteMany
    size: 1Gi
  resources:
    php:
      requests: { cpu: 100m,  memory: 512Mi }
      limits:   { cpu: "2",   memory: 2Gi }
    nginx:
      requests: { cpu: 25m,   memory: 64Mi }
      limits:   { cpu: 500m,  memory: 256Mi }
  traefik:
    enabled: true
    ingressRoute:
      enabled: true
      entryPoints:
        - web
        - websecure
    tls:
      enabled: true
      secretName: nextcloud-tls
    tlsOption:
      enabled: true
    tlsStore:
      enabled: true
    serversTransport:
      enabled: false
      name: "backend-internal-mtls"
      insecureSkipVerify: true
    middlewares:
      rateLimit:
        enabled: true
        average: 100
        burst: 50
      forwardAuth:
        enabled: false
        address: "http://keycloak-oauth2-oauth2-proxy.keycloak-oauth2.svc.k8scluster:4180"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-User"
          - "X-Auth-Email"
          - "Authorization"
        excludeSyncPaths: true
      headers:
        enabled: true
      redirectRegex:
        enabled: true
      buffering:
        enabled: true
        maxRequestBodyBytes: 17179869184  # 16GB
      compress:
        enabled: true
  # OpenID Connect (Keycloak SSO) Integration
  oidc:
    enabled: true
    providerUrl: "https://keycloak.seang.shop/realms/enterprise-realm"
    clientId: "oauth2-proxy"
    clientSecret: "Secret-Keycloak-OAuth2Proxy-2026-ChangeMe"
    autoRedirect: true
    endSessionRedirect: true
    logoutUrl: "https://keycloak.seang.shop/realms/enterprise-realm/protocol/openid-connect/logout?client_id=oauth2-proxy&post_logout_redirect_uri=https%3A%2F%2Fnextcloud.seang.shop%2F"
    buttonText: "Log in with Keycloak"
    disableRegistration: false
    redirFallback: true
    scope: "openid profile email"
    codeChallengeMethod: "S256"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  networkPolicy:
    enabled: true
