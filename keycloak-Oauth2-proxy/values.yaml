# ===========================================================================
# keycloak-Oauth2-proxy Umbrella Chart Values (Optimized & Production Ready)
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. PostgreSQL Subchart Configuration (Keycloak Persistent Storage)
# ---------------------------------------------------------------------------
postgres:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    database: keycloak
    username: keycloak
    password: "CHANGE_ME_POSTGRES_PASSWORD"
    existingSecret: ""

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    storageClass: "nfs-client"
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# 2. Keycloak Subchart Configuration (Production Mode)
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  production: true                     # Executes "start" for production mode

  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0.5"
    pullPolicy: IfNotPresent

  admin:
    username: admin
    password: "CHANGE_ME_KEYCLOAK_ADMIN"
    existingSecret: ""

  db:
    enabled: true
    vendor: "postgres"
    url: "jdbc:postgresql://keycloak-oauth2-postgres:5432/keycloak"
    username: "keycloak"
    password: "CHANGE_ME_POSTGRES_PASSWORD"
    existingSecret: ""

  service:
    type: ClusterIP
    port: 8080

  proxy:
    headers: "xforwarded"
    hostname: "keycloak.seang.shop"
    hostnameStrict: "false"

  traefik:
    enabled: true
    domain: "keycloak.seang.shop"
    tls:
      enabled: true
      secretName: "keycloak-tls"

  resources:
    requests:
      cpu: 300m
      memory: 1.5Gi
    limits:
      cpu: "1.5"
      memory: 2.5Gi

  autoscaling:
    enabled: false                     # Set true in production to enable HPA
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

  realmImport:
    enabled: true
    realmName: "enterprise-realm"
    clientId: "oauth2-proxy"
    clientSecret: "Secret-Keycloak-OAuth2Proxy-2026-ChangeMe"

# ---------------------------------------------------------------------------
# 3. OAuth2-Proxy Subchart Configuration
# (Service Address: http://oauth2-proxy.default.svc.cluster.local:4180)
# ---------------------------------------------------------------------------
oauth2-proxy:
  enabled: true

  service:
    portNumber: 4180

  traefik:
    enabled: true
    domain: "auth.seang.shop"
    tls:
      enabled: true
      secretName: "oauth2-proxy-tls"

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  config:
    clientID: "oauth2-proxy"
    clientSecret: "Secret-Keycloak-OAuth2Proxy-2026-ChangeMe"
    cookieSecret: "dquJq9nDOyt+IaQ5PsfnWRpK1KPr3HNY"

  extraArgs:
    provider: "oidc"
    oidc-issuer-url: "https://keycloak.seang.shop/realms/enterprise-realm"
    email-domain: "*"
    upstream: "file:///dev/null"
    pass-user-headers: "true"
    set-xauthrequest: "true"
    cookie-secure: "false"
    skip-provider-button: "true"
    ssl-insecure-skip-verify: "true"

# ---------------------------------------------------------------------------
# 4. Cert-Manager Global Configuration
# ---------------------------------------------------------------------------
cert-manager:
  enabled: true
  clusterIssuer:
    name: "letsencrypt-prod"
    email: "pengseangsim210@gmail.com"
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretRef: "letsencrypt-prod"
    solvers:
      - http01:
          ingress:
            class: "traefik"

