# ===========================================================================
# keycloak-Oauth2-proxy Umbrella Chart Values (Optimized & Production Ready)
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. PostgreSQL Subchart Configuration (Keycloak Persistent Storage)
# ---------------------------------------------------------------------------
postgres:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    database: keycloak
    username: keycloak
    password: "CHANGE_ME_POSTGRES_PASSWORD"
    existingSecret: ""

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    storageClass: "nfs-client"
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# 2. Keycloak Subchart Configuration (Production Mode)
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  production: true                     # Executes "start" for production mode

  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0.5"
    pullPolicy: IfNotPresent

  admin:
    username: admin
    password: "CHANGE_ME_KEYCLOAK_ADMIN"
    existingSecret: ""

  db:
    enabled: true
    vendor: "postgres"
    url: "jdbc:postgresql://keycloak-Oauth2-proxy-postgres:5432/keycloak"
    username: "keycloak"
    password: "CHANGE_ME_POSTGRES_PASSWORD"
    existingSecret: ""

  service:
    type: ClusterIP
    port: 8080

  proxy:
    headers: "xforwarded"
    hostname: "keycloak.example.com"
    hostnameStrict: "false"

  traefik:
    enabled: true
    domain: "keycloak.example.com"
    tls:
      enabled: true
      secretName: "keycloak-tls"

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi

  autoscaling:
    enabled: false                     # Set true in production to enable HPA
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

  realmImport:
    enabled: true
    realmName: "enterprise-realm"
    clientId: "oauth2-proxy"
    clientSecret: "Secret-Keycloak-OAuth2Proxy-2026-ChangeMe"

# ---------------------------------------------------------------------------
# 3. OAuth2-Proxy Subchart Configuration
# (Service Address: http://oauth2-proxy.default.svc.cluster.local:4180)
# ---------------------------------------------------------------------------
oauth2-proxy:
  enabled: true

  service:
    portNumber: 4180

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  config:
    clientID: "oauth2-proxy"
    clientSecret: "Secret-Keycloak-OAuth2Proxy-2026-ChangeMe"
    cookieSecret: "dquJq9nDOyt+IaQ5PsfnWRpK1KPr3HNYKctH4WhF9Tc="

  extraArgs:
    provider: "oidc"
    oidc-issuer-url: "https://keycloak.example.com/realms/enterprise-realm"
    email-domain: "*"
    upstreams: "file:///dev/null"
    pass-user-headers: "true"
    set-xauthrequest: "true"
    cookie-secure: "false"
    skip-provider-button: "true"
