{{- $certManager := index .Values "cert-manager" -}}
{{- if and $certManager (default true $certManager.enabled) -}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $certManager.clusterIssuer.name | default "letsencrypt-prod" }}
spec:
  acme:
    server: {{ $certManager.clusterIssuer.server | default "https://acme-v02.api.letsencrypt.org/directory" }}
    email: {{ $certManager.clusterIssuer.email | default "pengseangsim210@gmail.com" }}
    privateKeySecretRef:
      name: {{ $certManager.clusterIssuer.privateKeySecretRef | default "letsencrypt-prod" }}
    solvers:
      {{- toYaml $certManager.clusterIssuer.solvers | nindent 6 }}
{{- end }}
