enabled: true

image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

auth:
  database: keycloak
  username: keycloak
  password: "CHANGE_ME_POSTGRES_PASSWORD"
  existingSecret: ""

service:
  type: ClusterIP
  port: 5432

persistence:
  enabled: true
  storageClass: "nfs-client"
  size: 10Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
